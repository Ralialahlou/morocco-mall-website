<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Morocco Mall Rabat — La prochaine grande destination Morocco Mall dans la capitale du Royaume. Bientôt ouvert." />
  <title>Morocco Mall Rabat — À venir</title>
  <link rel="icon" href="../assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    /* ============================================================
       RABAT COMING SOON PAGE
       ============================================================ */

    .cs-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: var(--black);
    }

    .cs-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .cs-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 60%, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.75) 100%);
    }

    .cs-content {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(3rem, 10vh, 7rem) 2rem;
      color: var(--white);
    }

    .cs-logo {
      margin-bottom: 3rem;
    }
    .cs-logo img {
      height: 36px;
      opacity: 0.85;
      filter: brightness(0) invert(1);
    }

    .cs-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(201,169,110,0.1);
      border: 1px solid rgba(201,169,110,0.25);
      border-radius: 2px;
      padding: 0.4rem 1rem;
      font-family: var(--font-body);
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 2rem;
    }

    .cs-city {
      font-family: var(--font-body);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 1rem;
    }

    .cs-title {
      font-family: var(--font-display);
      font-size: clamp(3.5rem, 10vw, 7rem);
      font-weight: 400;
      line-height: 0.92;
      letter-spacing: -0.02em;
      margin-bottom: 2.5rem;
    }
    .cs-title em {
      font-style: italic;
      color: var(--gold);
    }

    .cs-desc {
      font-family: var(--font-body);
      font-size: clamp(0.9rem, 1.5vw, 1.05rem);
      line-height: 1.75;
      color: rgba(255,255,255,0.6);
      max-width: 480px;
      margin: 0 auto 3.5rem;
    }

    .cs-rule {
      width: 3rem;
      height: 1px;
      background: rgba(201,169,110,0.4);
      margin: 0 auto 3rem;
    }

    .cs-back {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      color: rgba(255,255,255,0.5);
      font-family: var(--font-body);
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.2s;
    }
    .cs-back:hover { color: var(--gold); }
    .cs-back svg { transform: rotate(180deg); }

    .cs-footer-bar {
      position: relative;
      z-index: 2;
      padding: 1.5rem 2rem;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      justify-content: center;
    }
    .cs-footer-bar p {
      font-family: var(--font-body);
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.25);
    }

    /* Reveal */
    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s var(--ease-out), transform 0.8s var(--ease-out);
    }
    .reveal.in-view { opacity: 1; transform: translateY(0); }
    .reveal-delay-1 { transition-delay: 0.12s; }
    .reveal-delay-2 { transition-delay: 0.24s; }
    .reveal-delay-3 { transition-delay: 0.36s; }
    .reveal-delay-4 { transition-delay: 0.48s; }
    .reveal-delay-5 { transition-delay: 0.6s; }
  </style>
</head>
<body>

<div class="cs-page">
  <canvas class="cs-canvas" id="bgCanvas" aria-hidden="true"></canvas>
  <div class="cs-overlay"></div>

  <div class="cs-content">
    <div class="cs-logo reveal">
      <img src="../assets/logo.png" alt="Morocco Mall" />
    </div>

    <div class="cs-badge reveal reveal-delay-1">
      <svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="3" fill="currentColor" opacity="0.6"/></svg>
      À venir
    </div>

    <p class="cs-city reveal reveal-delay-2">Rabat · La Capitale</p>

    <h1 class="cs-title reveal reveal-delay-2">
      Morocco<br>Mall <em>Rabat</em>
    </h1>

    <p class="cs-desc reveal reveal-delay-3">
      La capitale du Royaume accueillera bientôt sa nouvelle adresse de prestige. Un lieu unique, à l'image de Rabat — élégant, culturel et tourné vers l'avenir.
    </p>

    <div class="cs-rule reveal reveal-delay-4"></div>

    <a href="../index.html" class="cs-back reveal reveal-delay-5">
      <svg width="16" height="6" viewBox="0 0 16 6" fill="none" aria-hidden="true"><path d="M0 3h14M14 3L11 1M14 3L11 5" stroke="currentColor" stroke-width="1.2"/></svg>
      Retour à l'accueil
    </a>
  </div>

  <div class="cs-footer-bar">
    <p>© Morocco Mall · Groupe Aksal · Tous droits réservés</p>
  </div>
</div>

<div id="chrome-mount"></div>
<script src="../js/seo.js" defer></script>
<script src="../js/translations.js" defer></script>
<script src="../js/app.js" defer></script>
<script>
  // Background canvas — Rabat medina tones (blue & white)
  (function () {
    var canvas = document.getElementById('bgCanvas');
    if (!canvas) return;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;

    // Deep background
    var bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#04080F');
    bg.addColorStop(0.5, '#080D16');
    bg.addColorStop(1, '#050810');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Blue glow — Rabat blue city spirit
    var glow = ctx.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.45, W * 0.6);
    glow.addColorStop(0, 'rgba(30,70,140,0.25)');
    glow.addColorStop(0.5, 'rgba(20,50,100,0.12)');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    // Gold accent glow (Morocco Mall brand)
    var goldGlow = ctx.createRadialGradient(W * 0.75, H * 0.25, 0, W * 0.75, H * 0.25, W * 0.35);
    goldGlow.addColorStop(0, 'rgba(201,169,110,0.1)');
    goldGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = goldGlow;
    ctx.fillRect(0, 0, W, H);

    // Geometric grid — mashrabiya lattice
    ctx.save();
    ctx.globalAlpha = 0.04;
    ctx.strokeStyle = '#C9A96E';
    ctx.lineWidth = 0.8;
    var step = 48;
    for (var x = 0; x < W + step; x += step) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (var y = 0; y < H + step; y += step) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    // Diagonal overlay
    for (var i = -H; i < W + H; i += step * 2) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + H, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i - H, H); ctx.stroke();
    }
    ctx.restore();

    // Star geometric pattern — center
    var cx = W * 0.5, cy = H * 0.42, starR = Math.min(W, H) * 0.22;
    ctx.save();
    ctx.globalAlpha = 0.055;
    ctx.strokeStyle = '#C9A96E';
    ctx.lineWidth = 1;
    for (var k = 0; k < 12; k++) {
      var angle = (k / 12) * Math.PI * 2;
      var innerAngle = angle + Math.PI / 12;
      ctx.beginPath();
      ctx.moveTo(cx + starR * Math.cos(angle), cy + starR * Math.sin(angle));
      ctx.lineTo(cx + starR * 0.4 * Math.cos(innerAngle), cy + starR * 0.4 * Math.sin(innerAngle));
      ctx.lineTo(cx + starR * Math.cos(angle + Math.PI / 6), cy + starR * Math.sin(angle + Math.PI / 6));
      ctx.stroke();
    }
    ctx.restore();

    // Stars in sky
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    for (var s = 0; s < 60; s++) {
      var sx = Math.random() * W, sy = Math.random() * H * 0.5;
      var sr = Math.random() * 1.2;
      ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
    }
  })();

  // Intersection Observer
  (function () {
    var els = document.querySelectorAll('.reveal');
    if (!els.length) return;
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in-view'); obs.unobserve(e.target); }
      });
    }, { threshold: 0.05 });
    els.forEach(function (el) { obs.observe(el); });
    // Trigger visible elements immediately
    setTimeout(function () {
      els.forEach(function (el) {
        var rect = el.getBoundingClientRect();
        if (rect.top < window.innerHeight) el.classList.add('in-view');
      });
    }, 100);
  })();
</script>
</body>
</html>
